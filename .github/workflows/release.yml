name: release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching VERSION on main (never creates a tag)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify existing main-line tag and VERSION
        id: tag
        env:
          PT_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py check-tag --tag "$PT_TAG"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.prepare.outputs.commit }}
      release-version: ${{ needs.prepare.outputs.version }}

  draft:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pt-cli-bundle-${{ needs.build.outputs.commit }}-${{ github.run_attempt }}
          path: dist/release
      - name: Recheck tag and upload only an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          PT_TAG: ${{ needs.prepare.outputs.version }}
          PT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python scripts/release.py check-tag --tag "$PT_TAG" --expected-commit "$PT_COMMIT"
          python scripts/release.py create-draft --repository "$GITHUB_REPOSITORY" --tag "$PT_TAG" --commit "$PT_COMMIT" --assets dist/release
