name: release

# Every push to main is checked; only a commit whose VERSION has no tag yet
# builds, tags, and publishes. Manual runs retry the same decision on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Decide whether VERSION is new
        id: plan
        run: python scripts/release.py plan --commit "$GITHUB_SHA"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.prepare.outputs.commit }}
      release-version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pt-cli-bundle-${{ needs.build.outputs.commit }}-${{ github.run_attempt }}
          path: dist/release
      - name: Tag, upload to a draft, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PT_TAG: ${{ needs.prepare.outputs.version }}
          PT_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python scripts/release.py publish --repository "$GITHUB_REPOSITORY" --tag "$PT_TAG" --commit "$PT_COMMIT" --assets dist/release --changelog CHANGELOG.md
