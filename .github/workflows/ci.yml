name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Python for synthetic acceptance and packaging
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build identity
        id: identity
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=v0.4.0-alpha+g${commit:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build both command entry points
        shell: bash
        env:
          PT_VERSION: ${{ steps.identity.outputs.version }}
          PT_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-X github.com/tonycoder-hub/ptctl/internal/cli.Version=$PT_VERSION -X github.com/tonycoder-hub/ptctl/internal/cli.Commit=$PT_COMMIT" -o dist/ ./cmd/pt ./cmd/ptctl
      - name: Read-only synthetic acceptance
        shell: bash
        env:
          PT_VERSION: ${{ steps.identity.outputs.version }}
          PT_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python scripts/readonly_acceptance.py --bin "dist/pt${suffix}" --legacy-bin "dist/ptctl${suffix}" --version "$PT_VERSION" --commit "$PT_COMMIT"
      - name: Package and verify Windows amd64 delivery
        if: runner.os == 'Windows'
        shell: bash
        env:
          PT_VERSION: ${{ steps.identity.outputs.version }}
          PT_COMMIT: ${{ steps.identity.outputs.commit }}
        run: python scripts/package_windows.py --version "$PT_VERSION" --commit "$PT_COMMIT"
      - name: Upload Windows amd64 preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pt-cli-windows-amd64-${{ steps.identity.outputs.commit }}-${{ github.run_attempt }}
          path: |
            dist/windows/*.zip
            dist/windows/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
