name: native packages

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      release-version:
        type: string
        default: ''
    outputs:
      commit:
        value: ${{ jobs.identity.outputs.commit }}
      version:
        value: ${{ jobs.identity.outputs.version }}
      channel:
        value: ${{ jobs.identity.outputs.channel }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: identity
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: python scripts/release.py identity --release-version "$RELEASE_VERSION"

  test:
    needs: identity
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PT_VERSION: ${{ needs.identity.outputs.version }}
      PT_COMMIT: ${{ needs.identity.outputs.commit }}
      PT_CHANNEL: ${{ needs.identity.outputs.channel }}
      PT_GOOS: ${{ matrix.goos }}
      PT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native target and source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PT_COMMIT"
          test "$(go env GOOS)" = "$PT_GOOS"
          test "$(go env GOARCH)" = "$PT_GOARCH"
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Release guard and packaging regression tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build both command entry points twice
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/build-a dist/build-b
          flags="-buildid= -X github.com/tonycoder-hub/ptctl/internal/cli.Version=$PT_VERSION -X github.com/tonycoder-hub/ptctl/internal/cli.Commit=$PT_COMMIT"
          go build -trimpath -buildvcs=false -ldflags "$flags" -o dist/build-a/ ./cmd/pt ./cmd/ptctl
          go build -trimpath -buildvcs=false -ldflags "$flags" -o dist/build-b/ ./cmd/pt ./cmd/ptctl
      - name: Reproducible package and native extracted acceptance
        shell: bash
        run: |
          python scripts/package.py --binaries dist/build-a --compare-binaries dist/build-b --output dist/package \
            --version "$PT_VERSION" --commit "$PT_COMMIT" --goos "$PT_GOOS" --goarch "$PT_GOARCH" \
            --channel "$PT_CHANNEL" --go-version "$(go env GOVERSION)"
      - name: Upload verified native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pt-cli-${{ matrix.goos }}-${{ matrix.goarch }}-${{ needs.identity.outputs.commit }}-${{ github.run_attempt }}
          path: |
            dist/package/*.zip
            dist/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble:
    needs: [identity, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pt-cli-*-${{ needs.identity.outputs.commit }}-${{ github.run_attempt }}
          path: dist/native
      - name: Validate the complete asset set
        env:
          PT_VERSION: ${{ needs.identity.outputs.version }}
          PT_COMMIT: ${{ needs.identity.outputs.commit }}
          PT_CHANNEL: ${{ needs.identity.outputs.channel }}
        run: python scripts/release.py assemble --source dist/native --output dist/release --version "$PT_VERSION" --commit "$PT_COMMIT" --channel "$PT_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pt-cli-bundle-${{ needs.identity.outputs.commit }}-${{ github.run_attempt }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
